
# 红米 AX6S OpenWrt 固件自动构建。
# NaiveProxy、Xray、Sing-box 使用官方 ARM64 预编译核心，保持现有软件包与服务配置。
# 对 APT 和依赖下载增加重试与校验；仅在固件发布成功后记录自动更新提交。
name: Build Redmi-MTK-AX6S OpenWrt

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: '是否通过 SSH 进入 Actions 调试'
        required: false
        default: 'false'

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: Redmi-mtk-AX6S.config
  DIY_P1_SH: diy-mtk-part1.sh
  DIY_P2_SH: diy-mtk-part2.sh
  UPLOAD_BIN_DIR: true
  UPLOAD_FIRMWARE: false
  UPLOAD_COWTRANSFER: false
  UPLOAD_WETRANSFER: false
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

permissions:
  contents: write
  actions: write

# 防止多个固件编译同时占用资源；同组只保留最新的待处理构建请求。
concurrency:
  group: ax6s-firmware-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      # 保留已经验证可用的磁盘空间优化设置。
      - name: Before freeing up disk space
        run: df -hT

      - name: Optimize Disk Space
        uses: hugoalh/disk-space-optimizer-ghaction@v0.8.1
        with:
          operate_sudo: 'True'
          general_include: '.+'
          general_exclude: |-
            ^GCC$
            ^G\+\+$
            Clang
            LLVM
          docker_include: '.+'
          docker_prune: 'True'
          docker_clean: 'True'
          apt_prune: 'True'
          apt_clean: 'True'
          homebrew_prune: 'True'
          homebrew_clean: 'True'
          npm_prune: 'True'
          npm_clean: 'True'
          os_swap: 'True'

      - name: Freeing up disk space
        uses: wekingchen/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          swap-size-mb: 1
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Free up disk space complete
        run: df -hT

      - name: Checkout
        uses: actions/checkout@main

      # 初始化环境：APT 和远程依赖清单最多重试五次，失败会保留日志。
      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        shell: bash
        run: |
          set -Eeuo pipefail
          (
            set -Eeuo pipefail

            # 对短暂的网络故障进行有限次数重试，最终仍失败则中止构建。
            retry() {
              local attempt=1
              local max_attempts=5
              local delay=8
              while ! "$@"; do
                if (( attempt >= max_attempts )); then
                  echo "::error::命令重试 ${max_attempts} 次仍失败：$*"
                  return 1
                fi
                echo "第 ${attempt} 次失败，$((attempt * delay)) 秒后重试：$*"
                sleep "$((attempt * delay))"
                ((attempt += 1))
              done
            }

            sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc

            # APT 本身还会对下载失败进行重试。
            retry sudo -E apt-get -o Acquire::Retries=4 -qq update

            # 必须使用 HTTPS，下载完成后校验内容，再交给 apt-get。
            dependency_file="$RUNNER_TEMP/ax6s-depends-ubuntuLTS.txt"
            retry curl -fSL --retry 4 --retry-delay 3 --retry-all-errors \
              --connect-timeout 15 --max-time 120 \
              -o "$dependency_file" \
              'https://raw.githubusercontent.com/wekingchen/my-file/master/depends-ubuntuLTS'

            test -s "$dependency_file" || {
              echo '::error::编译依赖清单为空，拒绝继续安装'
              exit 1
            }

            # 依赖文件应只包含 Ubuntu 软件包名，避免下载异常被误当成包名。
            if ! tr '[:space:]' '\n' < "$dependency_file" | grep -Ev '^$' \
              | grep -Eq '^[A-Za-z0-9][A-Za-z0-9.+:-]*$'; then
              echo '::error::依赖清单未包含有效软件包名'
              exit 1
            fi
            if tr '[:space:]' '\n' < "$dependency_file" | grep -Ev '^$' \
              | grep -Ev '^[A-Za-z0-9][A-Za-z0-9.+:-]*$'; then
              echo '::error::依赖清单中包含非法内容，拒绝继续安装'
              exit 1
            fi

            read -r -a dependencies <<< "$(tr '\n' ' ' < "$dependency_file")"
            echo "共准备安装 ${#dependencies[@]} 个依赖软件包"
            (( ${#dependencies[@]} >= 30 )) || {
              echo '::error::依赖清单条目数异常，拒绝继续构建'
              exit 1
            }
            retry sudo -E apt-get -o Acquire::Retries=4 -qq -y install "${dependencies[@]}"

            retry sudo -E apt-get -o Acquire::Retries=4 -qq -y autoremove --purge
            retry sudo -E apt-get -o Acquire::Retries=4 -qq -y remove subversion
            retry sudo -E apt-get -o Acquire::Retries=4 -qq -y install subversion
            sudo -E apt-get -qq clean
            sudo timedatectl set-timezone "$TZ"
            sudo chown "$USER:$(id -gn)" "$GITHUB_WORKSPACE"
            echo '初始化环境完成'
          ) 2>&1 | tee "$GITHUB_WORKSPACE/ax6s-init.log"

      - name: Clone source code
        run: |
          df -hT "$PWD"
          git clone --single-branch -b "$REPO_BRANCH" "$REPO_URL" openwrt

      - name: Load custom feeds
        run: |
          [ ! -e "$FEEDS_CONF" ] || mv "$FEEDS_CONF" openwrt/feeds.conf.default
          chmod +x "$DIY_P1_SH"
          cd openwrt
          "$GITHUB_WORKSPACE/$DIY_P1_SH"

      - name: Update feeds
        run: cd openwrt && ./scripts/feeds update -a

      - name: Install feeds
        run: cd openwrt && ./scripts/feeds install -a

      # 保留已经编译成功的脚本与官方预编译程序封装逻辑。
      - name: Load custom configuration and prebuilt binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          [ ! -e files ] || mv files openwrt/files
          [ ! -e "$CONFIG_FILE" ] || mv "$CONFIG_FILE" openwrt/.config
          chmod +x "$DIY_P2_SH"
          cd openwrt
          "$GITHUB_WORKSPACE/$DIY_P2_SH" 2>&1 | tee "$GITHUB_WORKSPACE/ax6s-prepare.log"

          test -s ax6s-prebuilt-versions.txt
          test -s feeds/packages/net/naiveproxy/files/ax6s-prebuilt/naive
          test -s feeds/packages/net/xray-core/files/ax6s-prebuilt/xray
          test -s feeds/packages/net/sing-box/files/ax6s-prebuilt/sing-box
          echo '三个官方预编译组件准备完成'
          cat ax6s-prebuilt-versions.txt

      - name: SSH connection to Actions
        uses: P3TERX/ssh2actions@v1.0.0
        if: (github.event.inputs.ssh == 'true' && github.event.inputs.ssh != 'false') || contains(github.event.action, 'ssh')
        env:
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

      # GN 依赖及预编译来源检查，沿用此前已验证规则。
      - name: Preflight GN dependency and prebuilt package audit
        run: |
          cd openwrt
          rm -rf tmp
          make defconfig

          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          def abort(message):
              print(f'::error::{message}', flush=True)
              sys.exit(1)

          config = Path('.config').read_text(errors='replace')
          selected = set(re.findall(
              r'^CONFIG_PACKAGE_([^=]+)=y$', config, re.M
          ))

          required = {'sing-box', 'naiveproxy', 'xray-core'}
          missing = required - selected
          if missing:
              abort('以下官方预编译核心未被选中：' + ', '.join(sorted(missing)))

          if 'iptables-nft' in selected and 'iptables-zz-legacy' in selected:
              abort('iptables-nft 与 iptables-zz-legacy 不能同时安装，请检查固件配置')

          if 'luci-app-ssr-plus' in selected:
              if 'luci-app-ssr-plus_Nftables_Transparent_Proxy' not in selected:
                  abort('当前固件要求 SSR Plus 使用 nftables 透明代理后端')

          if 'luci-app-ssr-plus_INCLUDE_Kcptun' in selected:
              kcptun_packages = list(Path('package/feeds').glob('*/kcptun-client/Makefile'))
              if not kcptun_packages:
                  abort('SSR Plus 启用了 Kcptun，但软件源中不存在 kcptun-client')

          print('[依赖预检] iptables 和 SSR Plus 依赖检查通过')

          if 'libcronet' in selected:
              abort('libcronet 仍被选中，可能触发 GN/Chromium 源码编译')

          expected_packages = {
              'naiveproxy': ('feeds/packages/net/naiveproxy/Makefile', 'naive'),
              'xray-core': ('feeds/packages/net/xray-core/Makefile', 'xray'),
              'sing-box': ('feeds/packages/net/sing-box/Makefile', 'sing-box'),
          }

          for pkg, (expected, binary) in expected_packages.items():
              active = Path('package/feeds/packages') / pkg / 'Makefile'
              source = Path(expected)
              if not active.is_file() or not source.is_file():
                  abort(f'{pkg} 的软件包规则不存在：{active}')
              if active.resolve() != source.resolve():
                  abort(f'{pkg} 的实际软件包来源不符合预期：{active} -> {active.resolve()}')

              makefile = active.read_text(errors='replace')
              marker = f'files/ax6s-prebuilt/{binary}'
              if marker not in makefile:
                  abort(f'{pkg} 未使用官方预编译封装，禁止继续编译')
              if 'gn/host' in makefile or 'golang/host' in makefile:
                  abort(f'{pkg} 仍包含 GN 或 Go 源码构建依赖')
              print(f'[GN-预检] {pkg}：官方预编译封装和软件包来源检查通过')

          files = set(Path('package/feeds').glob('*/*/Makefile'))
          files.update(Path('package').rglob('Makefile'))
          blockers = []

          for mf in sorted(files):
              if not mf.is_file():
                  continue
              content = mf.read_text(errors='replace')
              names = set(re.findall(
                  r'^define Package/([A-Za-z0-9_+.\-]+)\s*$', content, re.M
              ))
              names.update(re.findall(
                  r'^PKG_NAME\s*[:?+]?=\s*([A-Za-z0-9_+.\-]+)\s*$', content, re.M
              ))
              matched = names & selected
              if not matched:
                  continue
              uses_gn = re.search(
                  r'\bgn/host\b|(?<![\w-])gn\s+gen(?:\s|$)', content
              )
              if uses_gn:
                  blockers.append(f'{mf}: {", ".join(sorted(matched))}')

          if blockers:
              for item in blockers:
                  print('::error::检测到已选软件包可能调用 GN：' + item)
              sys.exit(1)

          print(
              f'[GN-预检] 通过：检查了 {len(files)} 个软件包规则，'
              '未发现已选软件包直接调用 GN'
          )
          PY

          make download -j8
          find dl -type f -size -1024c -print -delete

      - name: Upload prebuilt version manifest
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: AX6S-official-prebuilt-versions
          path: openwrt/ax6s-prebuilt-versions.txt
          if-no-files-found: ignore

      - name: Compile the firmware
        id: compile
        run: |
          set -o pipefail
          cd openwrt
          echo "$(nproc) 线程编译"
          make -j"$(nproc)" 2>&1 | tee "$GITHUB_WORKSPACE/ax6s-build.log"
          echo 'status=success' >> "$GITHUB_OUTPUT"
          grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
          [ ! -s DEVICE_NAME ] || echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> "$GITHUB_ENV"
          echo "FILE_DATE=_$(date +%Y%m%d%H%M)" >> "$GITHUB_ENV"

      # 任何失败都上传当前已经生成的初始化、准备、编译日志。
      - name: Upload failed build logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: AX6S-build-failure-${{ github.run_number }}
          path: |
            ax6s-init.log
            ax6s-prepare.log
            ax6s-build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Check space usage
        if: ${{ !cancelled() }}
        run: df -hT

      - name: Upload bin directory
        uses: actions/upload-artifact@v4
        if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
        with:
          name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: openwrt/bin

      - name: Organize files
        id: organize
        if: steps.compile.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true'
        run: |
          cd openwrt/bin/targets/*/*
          rm -rf packages
          echo "FIRMWARE=$PWD" >> "$GITHUB_ENV"
          echo 'status=success' >> "$GITHUB_OUTPUT"

      - name: Upload firmware directory
        uses: actions/upload-artifact@v4
        if: steps.organize.outputs.status == 'success'
        with:
          name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE }}

      - name: Upload firmware to cowtransfer
        id: cowtransfer
        if: steps.organize.outputs.status == 'success' && env.UPLOAD_COWTRANSFER == 'true'
        run: |
          curl -fsSL git.io/file-transfer | sh
          ./transfer cow --block 2621440 -s -p 64 --no-progress "${FIRMWARE}" 2>&1 | tee cowtransfer.log
          echo "url=$(grep https cowtransfer.log | cut -f3 -d' ')" >> "$GITHUB_OUTPUT"

      - name: Upload firmware to WeTransfer
        id: wetransfer
        if: steps.organize.outputs.status == 'success' && env.UPLOAD_WETRANSFER == 'true'
        run: |
          curl -fsSL git.io/file-transfer | sh
          ./transfer wet -s -p 16 --no-progress "${FIRMWARE}" 2>&1 | tee wetransfer.log
          echo "url=$(grep https wetransfer.log | cut -f3 -d' ')" >> "$GITHUB_OUTPUT"

      # 与此前成功版本一致，只有发现有效固件文件才能发布。
      - name: Generate release tag
        id: tag
        if: steps.compile.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true'
        run: |
          shopt -s nullglob
          dir=openwrt/bin/targets/mediatek/mt7622
          images=("$dir"/immortalwrt-*squashfs* "$dir"/immortalwrt-*-factory.bin)
          ((${#images[@]} > 0)) || {
            echo '没有找到 squashfs 固件，停止发布' >&2
            exit 1
          }
          echo "release_tag=$(date +%Y.%m.%d-%H%M)-AX6S-MTK" >> "$GITHUB_OUTPUT"
          cp openwrt/ax6s-prebuilt-versions.txt release.txt
          if [ "$UPLOAD_COWTRANSFER" = true ]; then
            echo "Cowtransfer: ${{ steps.cowtransfer.outputs.url }}" >> release.txt
          fi
          if [ "$UPLOAD_WETRANSFER" = true ]; then
            echo "WeTransfer: ${{ steps.wetransfer.outputs.url }}" >> release.txt
          fi
          echo 'status=success' >> "$GITHUB_OUTPUT"

      - name: Upload firmware to release
        uses: softprops/action-gh-release@v2
        if: steps.tag.outputs.status == 'success'
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          body_path: release.txt
          fail_on_unmatched_files: true
          files: |
            openwrt/bin/targets/mediatek/mt7622/immortalwrt-*squashfs*
            openwrt/bin/targets/mediatek/mt7622/immortalwrt-*-factory.bin
            openwrt/bin/targets/mediatek/mt7622/sha256sums
            openwrt/ax6s-prebuilt-versions.txt

      # 只有自动更新触发、且前面的固件发布成功，才准备成功标记。
      - name: 验证上游提交并生成成功标记
        id: upstream_success
        if: steps.tag.outputs.status == 'success' && github.event_name == 'repository_dispatch' && github.event.action == 'Source Code Update'
        env:
          UPSTREAM_SHA: ${{ github.event.client_payload.upstream_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! [[ "$UPSTREAM_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo '::error::自动更新请求缺少有效 upstream_sha，禁止记录成功状态'
            exit 1
          fi
          printf '%s\n' "$UPSTREAM_SHA" > .ax6s-upstream-success-marker
          echo "sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"

      # 只能在发布成功之后写入；失败、取消、初始化出错均不会误记。
      - name: 保存已成功构建的上游提交
        if: steps.upstream_success.outputs.sha != ''
        uses: actions/cache/save@v4
        with:
          path: .ax6s-upstream-success-marker
          key: AX6S-upstream-success-v2-${{ steps.upstream_success.outputs.sha }}

      # 以下清理步骤不参与判断固件是否已经成功发布。
      - name: Delete workflow runs
        uses: wekingchen/delete-workflow-runs@main
        if: steps.compile.outputs.status == 'success'
        continue-on-error: true
        with:
          retain_days: 1
          keep_minimum_runs: 10

      - name: Remove old Releases
        uses: dev-drprasad/delete-older-releases@v0.3.4
        if: steps.tag.outputs.status == 'success'
        continue-on-error: true
        with:
          keep_latest: 8
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
