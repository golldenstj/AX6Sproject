
# Redmi AX6S OpenWrt 自动构建。
# NaiveProxy、Xray、Sing-box 均使用官方 ARM64 预编译程序。
# 构建前检查实际 Feeds 选中来源和 GN 依赖，避免上游变更重新引入 Chromium 编译。
name: Build Redmi-MTK-AX6S OpenWrt

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: '是否通过 SSH 进入 Actions 调试'
        required: false
        default: 'false'

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: Redmi-mtk-AX6S.config
  DIY_P1_SH: diy-mtk-part1.sh
  DIY_P2_SH: diy-mtk-part2.sh
  UPLOAD_BIN_DIR: true
  UPLOAD_FIRMWARE: false
  UPLOAD_COWTRANSFER: false
  UPLOAD_WETRANSFER: false
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      # 保留原有磁盘清理方式，避免大体积工具链占满运行环境。
      - name: Before freeing up disk space
        run: df -hT

      - name: Optimize Disk Space
        uses: hugoalh/disk-space-optimizer-ghaction@v0.8.1
        with:
          operate_sudo: 'True'
          general_include: '.+'
          general_exclude: |-
            ^GCC$
            ^G\+\+$
            Clang
            LLVM
          docker_include: '.+'
          docker_prune: 'True'
          docker_clean: 'True'
          apt_prune: 'True'
          apt_clean: 'True'
          homebrew_prune: 'True'
          homebrew_clean: 'True'
          npm_prune: 'True'
          npm_clean: 'True'
          os_swap: 'True'

      - name: Freeing up disk space
        uses: wekingchen/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          swap-size-mb: 1
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Free up disk space complete
        run: df -hT

      - name: Checkout
        uses: actions/checkout@main

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install $(curl -fsSL raw.githubusercontent.com/wekingchen/my-file/master/depends-ubuntuLTS)
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq remove subversion
          sudo -E apt-get -qq install subversion
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"
          sudo chown "$USER:$GROUPS" "$GITHUB_WORKSPACE"

      - name: Clone source code
        run: |
          df -hT "$PWD"
          git clone --single-branch -b "$REPO_BRANCH" "$REPO_URL" openwrt

      - name: Load custom feeds
        run: |
          [ ! -e "$FEEDS_CONF" ] || mv "$FEEDS_CONF" openwrt/feeds.conf.default
          chmod +x "$DIY_P1_SH"
          cd openwrt
          "$GITHUB_WORKSPACE/$DIY_P1_SH"

      - name: Update feeds
        run: cd openwrt && ./scripts/feeds update -a

      - name: Install feeds
        run: cd openwrt && ./scripts/feeds install -a

      # 完成官方预编译封装，生成版本清单。
      # 保持软件包名、配置文件和服务脚本不变。
      - name: Load custom configuration and prebuilt binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ ! -e files ] || mv files openwrt/files
          [ ! -e "$CONFIG_FILE" ] || mv "$CONFIG_FILE" openwrt/.config
          chmod +x "$DIY_P2_SH"
          cd openwrt
          "$GITHUB_WORKSPACE/$DIY_P2_SH"
          test -s ax6s-prebuilt-versions.txt
          test -s feeds/packages/net/naiveproxy/files/ax6s-prebuilt/naive
          test -s feeds/packages/net/xray-core/files/ax6s-prebuilt/xray
          test -s feeds/packages/net/sing-box/files/ax6s-prebuilt/sing-box
          cat ax6s-prebuilt-versions.txt

      - name: SSH connection to Actions
        uses: P3TERX/ssh2actions@v1.0.0
        if: (github.event.inputs.ssh == 'true' && github.event.inputs.ssh != 'false') || contains(github.event.action, 'ssh')
        env:
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

      # 先完成配置解析，再对实际软件包来源及所选依赖做前置验证。
      # 即使上游以后增加其它 GN 使用者，也尽量在耗时编译前发现。
      - name: Preflight GN dependency and prebuilt package audit
        run: |
          cd openwrt
          # 软件包规则在 Feeds 安装之后被改写，强制刷新依赖元数据。
          rm -rf tmp
          make defconfig
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          def abort(message):
              print(f'::error::{message}', flush=True)
              sys.exit(1)

          config = Path('.config').read_text(errors='replace')
          selected = set(re.findall(r'^CONFIG_PACKAGE_([^=]+)=y$', config, re.M))
          if 'sing-box' not in selected or 'naiveproxy' not in selected or 'xray-core' not in selected:
              abort('三个官方预编译核心有一个未被选中，请检查 .config')
          if 'libcronet' in selected:
              abort('libcronet 仍被选中，会触发 GN/Chromium 源码构建')

          # 安装所有 Feeds 时可能存在同名包覆盖，因此必须校验实际来源。
          for pkg, expected in {
              'naiveproxy': 'feeds/packages/net/naiveproxy/Makefile',
              'xray-core': 'feeds/packages/net/xray-core/Makefile',
              'sing-box': 'feeds/packages/net/sing-box/Makefile',
          }.items():
              active = Path('package/feeds/packages') / pkg / 'Makefile'
              source = Path(expected)
              if not active.is_file() or not source.is_file() or active.resolve() != source.resolve():
                  abort(f'{pkg} 的实际 Feeds 来源不符合预期：{active} -> {active.resolve()}')
              makefile = active.read_text(errors='replace')
              if f'files/ax6s-prebuilt/{"sing-box" if pkg == "sing-box" else "naive" if pkg == "naiveproxy" else "xray"}' not in makefile:
                  abort(f'{pkg} 被替换为非预编译 Makefile，禁止继续构建')
              if 'gn/host' in makefile or 'golang/host' in makefile:
                  abort(f'{pkg} 仍包含 GN 或 Go 源码构建依赖')
              print(f'[GN-预检] {pkg}: 官方预编译封装 / 实际来源检查通过')

          # 检查实际安装的软件包以及核心包。
          # 只扫描最终选中的包，避免未选中的同名包产生误报。
          files = set(Path('package/feeds').glob('*/*/Makefile'))
          files.update(Path('package').rglob('Makefile'))
          blockers = []
          for mf in sorted(files):
              if not mf.is_file():
                  continue
              content = mf.read_text(errors='replace')
              names = set(re.findall(r'^define Package/([A-Za-z0-9_+.\-]+)\s*$', content, re.M))
              # 同时兼容使用软件包名称变量定义的构建规则。
              names.update(re.findall(r'^PKG_NAME\s*[:?+]?=\s*([A-Za-z0-9_+.\-]+)\s*$', content, re.M))
              if not (names & selected):
                  continue
              if re.search(r'\bgn/host\b|(?<![\w-])gn\s+gen(?:\s|$)', content):
                  blockers.append(f'{mf}: {", ".join(sorted(names & selected))}')

          if blockers:
              for item in blockers:
                  print('::error::检测到实际选中包仍可能调用 GN：' + item)
              sys.exit(1)
          print(f'[GN-预检] 通过：共检查 {len(files)} 个安装/核心 Makefile，未发现所选软件包调用 GN')
          PY
          make download -j8
          find dl -type f -size -1024c -print -delete

      - name: Upload prebuilt version manifest
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: AX6S-official-prebuilt-versions
          path: openwrt/ax6s-prebuilt-versions.txt
          if-no-files-found: ignore

      # 不再执行整轮单线程重试。
      # 编译失败时上传本轮日志，避免重复消耗大量时间。
      - name: Compile the firmware
        id: compile
        run: |
          set -o pipefail
          cd openwrt
          echo "$(nproc) 线程编译"
          make -j"$(nproc)" V=sc 2>&1 | tee "$GITHUB_WORKSPACE/ax6s-build.log"
          echo 'status=success' >> "$GITHUB_OUTPUT"
          grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
          [ ! -s DEVICE_NAME ] || echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> "$GITHUB_ENV"
          echo "FILE_DATE=_$(date +%Y%m%d%H%M)" >> "$GITHUB_ENV"

      - name: Upload failed compile log
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: AX6S-build-failure-${{ github.run_number }}
          path: ax6s-build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Check space usage
        if: ${{ !cancelled() }}
        run: df -hT

      - name: Upload bin directory
        uses: actions/upload-artifact@v4
        if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
        with:
          name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: openwrt/bin

      - name: Organize files
        id: organize
        if: steps.compile.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true'
        run: |
          cd openwrt/bin/targets/*/*
          rm -rf packages
          echo "FIRMWARE=$PWD" >> "$GITHUB_ENV"
          echo 'status=success' >> "$GITHUB_OUTPUT"

      - name: Upload firmware directory
        uses: actions/upload-artifact@v4
        if: steps.organize.outputs.status == 'success'
        with:
          name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE }}

      - name: Upload firmware to cowtransfer
        id: cowtransfer
        if: steps.organize.outputs.status == 'success' && env.UPLOAD_COWTRANSFER == 'true'
        run: |
          curl -fsSL git.io/file-transfer | sh
          ./transfer cow --block 2621440 -s -p 64 --no-progress "${FIRMWARE}" 2>&1 | tee cowtransfer.log
          echo "url=$(grep https cowtransfer.log | cut -f3 -d' ')" >> "$GITHUB_OUTPUT"

      - name: Upload firmware to WeTransfer
        id: wetransfer
        if: steps.organize.outputs.status == 'success' && env.UPLOAD_WETRANSFER == 'true'
        run: |
          curl -fsSL git.io/file-transfer | sh
          ./transfer wet -s -p 16 --no-progress "${FIRMWARE}" 2>&1 | tee wetransfer.log
          echo "url=$(grep https wetransfer.log | cut -f3 -d' ')" >> "$GITHUB_OUTPUT"

      # 编译成功且固件存在时才创建发布版本。
      - name: Generate release tag
        id: tag
        if: steps.compile.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true'
        run: |
          shopt -s nullglob
          images=(openwrt/bin/targets/mediatek/mt7622/immortalwrt-*squashfs*)
          ((${#images[@]} > 0)) || { echo '没有找到 squashfs 固件，停止发布' >&2; exit 1; }
          echo "release_tag=$(date +%Y.%m.%d-%H%M)-AX6S-MTK" >> "$GITHUB_OUTPUT"
          cp openwrt/ax6s-prebuilt-versions.txt release.txt
          if [ "$UPLOAD_COWTRANSFER" = true ]; then
            echo "Cowtransfer: ${{ steps.cowtransfer.outputs.url }}" >> release.txt
          fi
          if [ "$UPLOAD_WETRANSFER" = true ]; then
            echo "WeTransfer: ${{ steps.wetransfer.outputs.url }}" >> release.txt
          fi
          echo 'status=success' >> "$GITHUB_OUTPUT"

      - name: Upload firmware to release
        uses: softprops/action-gh-release@v2
        if: steps.tag.outputs.status == 'success'
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          body_path: release.txt
          fail_on_unmatched_files: true
          files: |
            openwrt/bin/targets/mediatek/mt7622/immortalwrt-*squashfs*
            openwrt/ax6s-prebuilt-versions.txt

      # 编译成功后按既有保留规则清理旧运行记录。
      - name: Delete workflow runs
        uses: wekingchen/delete-workflow-runs@main
        if: steps.compile.outputs.status == 'success'
        with:
          retain_days: 1
          keep_minimum_runs: 10

      - name: Remove old Releases
        uses: dev-drprasad/delete-older-releases@v0.3.4
        if: steps.tag.outputs.status == 'success'
        with:
          keep_latest: 8
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
